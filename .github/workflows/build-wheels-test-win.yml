name: Mercury wheels Build and Publish to PyPI

on:
  workflow_dispatch:
  push:
    branches:
      - win-wheels-test

jobs:
  build-mercury-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    environment:
      name: pypi
      url: https://pypi.org/p/mercury-python
    permissions:
      id-token: write
    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pip packages
        run: vcpkg install zlib

      - name: Install pip packages
        run: python -m pip install cython cibuildwheel==2.20.0

      - name: Initialize Submodules
        run: git submodule update --init --recursive

      - name: Move submodules lib into the directory root
        run: copy src/libmerc/xsimd/include/xsimd/* src/libmerc/xsimd/

      - name: Build Mercury
        run: > 
          cd src/libmerc &&
          cmake -DCMAKE_BUILD_TYPE=Debug -DLIBMERC_ONLY=TRUE -B build-debug &&
          cmake --build build-debug --config Debug --parallel 1 &&
          cmake -DCMAKE_BUILD_TYPE=Release -DLIBMERC_ONLY=TRUE -B build-release &&
          cmake --build build-release --config Release --parallel 1 &&
          copy ./ ../../

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.20.0
        env:
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_BUILD: "cp313-*"
          CIBW_TEST_COMMAND: cd {project} && python mercury_python_test.py